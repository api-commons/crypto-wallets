            application/json:
              schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema: *id003
  /wallet-transactions/{wallet_transaction_id}:
    parameters:
    - $ref: '#/components/parameters/wallet_transaction_id'
    get:
      operationId: getWalletTransaction
      summary: Get a wallet transaction
      tags:
