openapi: 3.1.0
info:
  title: Crypto Wallets (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Crypto Wallets interface, distilled from the harvested OpenAPI of 345 providers in the
    APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /wallets:
    get:
      operationId: listWallets
      summary: List wallets
      tags:
      - Wallets
      x-commons-tier: core
      x-commons-share: 0.76
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Wallet'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createWallet
      summary: Create a wallet
      tags:
      - Wallets
      x-commons-tier: core
      x-commons-share: 0.52
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /wallets/{wallet_id}:
    parameters:
    - $ref: '#/components/parameters/wallet_id'
    get:
      operationId: getWallet
      summary: Get a wallet
      tags:
      - Wallets
      x-commons-tier: extended
      x-commons-share: 0.453
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
  /wallets/{wallet_id}/addresses:
    parameters:
    - $ref: '#/components/parameters/wallet_id'
    post:
      operationId: createWalletAddress
      summary: Create a wallet address
      tags:
      - Wallet Addresses
      x-commons-tier: core
      x-commons-share: 0.857
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/WalletAddress'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
    get:
      operationId: listAddresses
      summary: List addresses
      tags:
      - Wallet Addresses
      x-commons-tier: core
      x-commons-share: 0.714
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id002
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /wallets/{wallet_id}/balances:
    parameters:
    - $ref: '#/components/parameters/wallet_id'
    get:
      operationId: listBalances
      summary: List balances
      tags:
