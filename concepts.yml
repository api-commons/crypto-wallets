context: crypto-wallets
name: Crypto Wallets
intro: >-
  The common crypto-wallet vocabulary -- the wallets that hold digital assets, the addresses
  that receive them, the balances held, the transactions and transfers that move them and the
  tokens they hold -- distilled from the APIs that already exist. Market prices belong to the
  market-data context and orders to trading.
tags: [Wallets, Digital Assets, Stablecoins, Custody, Crypto, Cryptocurrency, Crypto Wallet, Wallet Infrastructure]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, wallet_id, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, create_date]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, labels, tags]
  status: [state, transaction_status, wallet_status]
  name: [title, display_name, label, nickname]
  chain: [blockchain, network, chain_id, network_id, protocol, asset_network]
  asset: [currency, token, coin, asset_id, symbol, currency_code, token_symbol, ticker]
  amount: [value, quantity, amount_value, balance_amount, qty]
  address: [wallet_address, public_address, deposit_address, destination_address]

concepts:
  wallet:
    segments: [wallets, wallet, vaults, vault_accounts, vault-accounts, accounts@custody|wallets|vault, sub_wallets]
    aliases:
      type: [wallet_type, custody_type, kind, account_type]
      owner_id: [user_id, owner, customer_id, entity_id, account_id]
      addresses: [address_list, deposit_addresses]
  wallet_address:
    requires: [wallet]
    path: /wallets/{wallet_id}/addresses
    segments: ["addresses@wallets|wallet|vaults|accounts|assets", deposit_addresses, deposit-addresses, receive_addresses]
    aliases:
      tag: [memo, destination_tag, address_tag]
      format: [address_format, type, encoding]
  wallet_balance:
    requires: [wallet]
    path: /wallets/{wallet_id}/balances
    segments: ["balances@wallets|wallet|vaults|accounts|addresses", "balance@wallets|wallet|addresses|address"]
    aliases:
      available: [available_balance, available_amount, spendable, free]
      pending: [pending_balance, locked, frozen, hold, on_hold]
      total: [total_balance, balance, amount]
  wallet_transaction:
    requires: [wallet]
    path: /wallet-transactions
    segments: [transactions, transaction, transfers, transfer, withdrawals, deposits, payouts@crypto]
    aliases:
      tx_hash: [hash, txid, tx_id, transaction_hash, txhash, blockchain_tx_id]
      from_address: [source, source_address, from, sender]
      to_address: [destination, destination_address, to, recipient]
      fee: [fees, network_fee, gas_fee, fee_amount]
      confirmations: [num_confirmations, block_confirmations]
      direction: [type, transaction_type, kind, operation]
      block_number: [block, block_height, height]
  token:
    requires: [wallet]
    segments: [tokens, token, supported_assets, assets@wallets|crypto|custody, currencies@crypto|wallets]
    aliases:
      contract_address: [contract, token_address, address, mint]
      decimals: [precision, decimal_places]
      symbol: [ticker, code]

exclude:
  wallet:
    angle: /vaults are DeFi yield vaults
    kamino: /kvaults/vaults are DeFi yield vaults
    figment: /vaults are staking vaults
  wallet_transaction:
    alpaca-markets: /accounts/{id}/transfers are brokerage cash transfers
duplicates:
  seshat-markets: [kronos-seshat]
  lootrush: [loot-rush-games]
  m0: [m-0]
  polygon: [massive-com]
  mesh: [mesh-connect]
  mystars: [mystars-faas-fulfilment-api]

findings:
  - "A wallet transaction agrees on id, status, direction and the transaction hash -- the hash
    is the one identifier every crypto API shares, because the chain assigns it."
  - "A wallet agrees only on an id: custodians, MPC wallet platforms and exchanges each model
    the wallet as a vault, an account or a key set."
  - "A token agrees on its symbol and name; contract address and decimals sit just below core."
decisions:
  - "Blockchain and Web3 are not cohort tags: they cover node, RPC and chain-data
    infrastructure more than wallets."
  - "A wallet covers vaults and vault accounts in custody platforms, but not DeFi yield or
    staking vaults, which are investment products."
  - "Wallet balances and transactions are `/wallets/{wallet_id}/balances` and
    `/wallet-transactions`: banking owns the bare words."
  - "Deposits, withdrawals and transfers are wallet transactions, told apart by `direction`."
  - "Duplicates merged: Seshat, LootRush, M0, Massive into Polygon, Mesh, MyStars."
