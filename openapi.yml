                  $ref: '#/components/schemas/WalletBalance'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /wallet-transactions:
    get:
      operationId: listWalletTransactions
      summary: List wallet transactions
      tags:
      - Wallet Transactions
      x-commons-tier: core
      x-commons-share: 0.87
